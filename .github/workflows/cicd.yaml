name: cicd

on:
  push:
    paths-ignore:
      - 'README.md'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # enable GitHub OIDC token issuance for this job
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: true
    defaults:
      run:
        working-directory: src
    steps:
    - uses: actions/checkout@v4
    - uses: olegtarasov/get-tag@v2.1.4
      id: tag
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - run: echo "::remove-matcher owner=csc::"
    - uses: reviewdog/action-setup@v1
    - run: dotnet --info
    - run: dotnet restore
    - run: dotnet build -c Release --no-restore | tee dotnet.buildlog
    - uses: SamhammerAG/dotnet-reviewdog-action@v2
      with:
        workdir: src
        reporter: github-check
        line_exclude_regex: ".*(warning|error) CS0618:.*"
    - run: dotnet test -c Release --no-build --logger "GitHubActions;report-warnings=false"
    - run: dotnet pack -c Release -p:Version=${{ steps.tag.outputs.tag || '1.0' }} --output nuget-packages
      # Get a short-lived NuGet API key
    - name: NuGet login (OIDC → temp API key)
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}
    - if: startsWith(github.ref, 'refs/tags/') 
      run: cd nuget-packages; dotnet nuget push "**/*.nupkg" --api-key ${{steps.login.outputs.NUGET_API_KEY}} --skip-duplicate --source https://api.nuget.org/v3/index.json
